<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сапёр — Brickyard Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d12">
<style>
  :root{
    --bg:#0a0d12; --panel:#121a23; --line:#1e2b38; --text:#e8f1f8;
    --muted:#7c8b9a; --neon:#39ff88; --danger:#ff3b6b; --gold:#f0c060;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1000px 600px at 50% -10%, #16324a 0%, transparent 60%),
               radial-gradient(800px 500px at 100% 100%, #2a1430 0%, transparent 55%), var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:min(760px,100%); text-align:center}
  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .back{color:var(--muted); text-decoration:none; font-size:14px; border:1px solid var(--line); padding:8px 14px; border-radius:10px; transition:.2s}
  .back:hover{color:var(--text); border-color:rgba(57,255,136,.4)}
  h1{margin:0; font-size:34px; letter-spacing:1px}
  h1 span{color:var(--neon); text-shadow:0 0 18px rgba(57,255,136,.5)}
  .bar{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:18px 0 16px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 18px; min-width:96px}
  .stat b{display:block; font-size:20px; color:var(--neon)}
  .stat small{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px}
  .board-wrap{max-width:100%; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; padding:2px 0 8px}
  .board{
    display:inline-grid; gap:4px; padding:12px; border-radius:16px; max-width:100%;
    background:linear-gradient(160deg,#0f1720,#0a1118); border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    user-select:none; -webkit-user-select:none;
  }
  .cell{
    width:var(--cell,34px); height:var(--cell,34px); border-radius:7px; border:0; cursor:pointer;
    background:linear-gradient(145deg,#22303d,#18222c);
    color:#dfe9f2; font-weight:800; font-size:16px; display:grid; place-items:center;
    transition:background .12s, transform .08s; padding:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    touch-action:manipulation;
  }
  .cell:hover{background:linear-gradient(145deg,#2b3d4d,#1f2c38)}
  .cell:active{transform:scale(.96)}
  .cell.open{background:#0d141b; box-shadow:inset 0 0 0 1px #1a2530; cursor:default}
  .cell.open:hover{background:#0d141b}
  .cell.mine{background:#3a1018; color:#ff8ba6}
  .cell.flag{color:var(--gold); font-size:15px}
  .cell.zone{box-shadow:inset 0 0 0 2px rgba(57,255,136,.55); background:rgba(57,255,136,.08)}
  .cell.zone.open{background:rgba(57,255,136,.06)}
  .cell.zone-src{box-shadow:inset 0 0 0 2px rgba(0,212,255,.7)}
  .cell.wrong{background:#3a1018; color:#ff8ba6}
  .n1{color:#6fb3ff} .n2{color:#59f28f} .n3{color:#ff8ba6} .n4{color:#c58bff}
  .n5{color:#ffb86b} .n6{color:#5ff2e0} .n7{color:#f0f0f0} .n8{color:#9aa7b4}
  .board.owner .cell{width:22px; height:22px; font-size:11px; border-radius:5px}
  @media (max-width:600px){ .board.owner .cell{width:16px; height:16px; font-size:9px} }
  .btns{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap}
  button.ui{
    padding:10px 20px; border-radius:10px; border:1px solid var(--line); cursor:pointer;
    background:var(--panel); color:var(--text); font-size:14px; font-weight:600;
  }
  button.ui:hover{border-color:rgba(57,255,136,.4)}
  button.primary{background:linear-gradient(180deg,#2dff8f,#12c96a); color:#052015; border:0; font-weight:800}
  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-wrap:wrap}
  .seg button{background:none; border:0; color:var(--muted); padding:9px 14px; cursor:pointer; font-size:13px}
  .seg button.on{background:rgba(57,255,136,.12); color:var(--neon)}
  .hint{color:var(--muted); font-size:13px; margin-top:12px}
  .overlay{
    position:fixed; inset:0; background:rgba(5,8,12,.7); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:10; padding:20px;
  }
  .overlay.show{display:flex}
  .modal{background:linear-gradient(160deg,#121b25,#0e151d); border:1px solid var(--line); border-radius:18px; padding:28px 34px; text-align:center; max-width:360px}
  .modal h2{margin:0 0 8px; font-size:28px}
  .modal p{margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.5}
  @media (max-width:520px){
    :root .cell{font-size:14px}
    h1{font-size:26px}
    #flagMode{width:100%; padding:12px 16px}
    .btns{gap:8px}
  }
</style>

<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← Аркада</a>
    <h1>САП<span>ЁР</span></h1>
    <div style="width:96px"></div>
  </div>

  <div class="bar">
    <div class="stat"><b id="mineCount">∞</b><small>мин</small></div>
    <div class="stat"><b id="opened">0</b><small>открыто</small></div>
    <div class="stat"><b id="timer">0:00</b><small>время</small></div>
    <div class="stat"><b id="flagsCount">0</b><small>флагов</small></div>
  </div>

  <div class="board-wrap"><div class="board" id="board"></div></div>

  <div class="btns">
    <div class="seg" id="modes">
      <button data-mode="endless" class="on">♾ Бесконечный</button>
      <button data-mode="normal">🧱 Обычный</button>
    </div>
  </div>
  <div class="btns" style="margin-top:10px">
    <div class="seg" id="levels">
      <button data-density="calm">🌿 Спокойно</button>
      <button data-density="classic" class="on">💣 Классика</button>
      <button data-density="hard">🔥 Хардкор</button>
    </div>
    <button class="ui primary" id="restart">Заново</button>
  </div>
  <div class="btns" style="margin-top:10px">
    <button class="ui" id="flagMode">🚩 Режим флажка: выкл</button>
  </div>

  <div class="hint" id="hint">Бесконечное поле: подходишь к краю — появляются новые клетки · ЛКМ — открыть · ПКМ — флажок</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="ovTitle">Взрыв!</h2>
    <p id="ovText">Ты наступил на мину.</p>
    <button class="ui primary" id="ovBtn">Ещё раз</button>
  </div>
</div>

<script>
/* ---------- сапёр: два режима ----------
   Бесконечный: мины считаются детерминированно из координат (x, y) и seed,
   поле расширяется само, сетка не хранится целиком.
   Обычный: фиксированное поле по кнопкам сложности, растёт только в бесконечном.
   В обоих режимах первый клик всегда безопасен: вокруг него вырезается зона 3×3.
   Один клик открывает максимум MAX_FLOOD клеток — иначе на низкой плотности
   "спокойный" клик выкашивал пол-поля и игра ломалась. */
const DENSITIES = {
  calm:    { value: 0.12, name: 'Спокойно' },
  classic: { value: 0.16, name: 'Классика' },
  hard:    { value: 0.22, name: 'Хардкор' }
};
const SECRET = { cols: 20, rows: 20, mines: 80 };
const START = { cols: 8, rows: 8 };
const MAX_SIDE = 96;
const MAX_FLOOD = 45;
const NORMAL = {
  calm:    { cols: 9,  rows: 9,  mines: 10 },
  classic: { cols: 12, rows: 12, mines: 24 },
  hard:    { cols: 14, rows: 14, mines: 45 }
};

let mode = 'endless';          // endless | normal | secret
let densityKey = 'classic';
let density = DENSITIES.classic.value;
let seed = 1;
let world = { minX: 0, minY: 0, maxX: START.cols - 1, maxY: START.rows - 1 };
let cells = new Map();         // ключ "x,y" -> { x, y, mine, open, flag, n }
let safeZone = new Set();
let secretMines = null;
let normalMines = null;

let started = false;
let dead = false;
let won = false;
let flags = 0;
let opened = 0;
let timer = 0;
let timerId = null;
let flagMode = false;
try { flagMode = localStorage.getItem('mines_flag_mode') === '1'; } catch (e) {}

const boardEl = document.getElementById('board');
const openedEl = document.getElementById('opened');
const timerEl = document.getElementById('timer');
const flagsEl = document.getElementById('flagsCount');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const levelsEl = document.getElementById('levels');
const modesEl = document.getElementById('modes');
const hintEl = document.getElementById('hint');
const mineCountEl = document.getElementById('mineCount');

/* В обычном режиме кнопки — это размеры поля, а не "плотность". */
const LEVEL_LABELS = {
  endless: { calm: '🌿 Спокойно', classic: '💣 Классика', hard: '🔥 Хардкор' },
  normal:  { calm: '🌿 9×9 · 10', classic: '💣 12×12 · 24', hard: '🔥 14×14 · 45' }
};

function key(x, y) { return x + ',' + y; }

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

function startTimer() {
  if (timerId) return;
  timerId = setInterval(function () {
    timer++;
    timerEl.textContent = fmtTime(timer);
  }, 1000);
}

/* ---------- звук ---------- */
let actx = null;
function snd(freq, dur, type, vol, when) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.08));
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + (dur || 0.08) + 0.02);
  } catch (e) {}
}
const sfxClick = function () { snd(520, .05, 'sine', .05); };
const sfxFlag  = function () { snd(880, .06, 'triangle', .06); };
const sfxBoom  = function () { snd(160, .18, 'sawtooth', .14); snd(90, .3, 'sawtooth', .12, .1); };
const sfxWin   = function () { snd(660, .09, 'triangle', .1); snd(880, .09, 'triangle', .1, .09); snd(1320, .18, 'triangle', .1, .18); };

/* ---------- генерация мира ---------- */
function rand2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function isMine(x, y) {
  const k = key(x, y);
  if (safeZone.has(k)) return false;
  if (mode === 'secret') return secretMines ? secretMines.has(k) : false;
  if (mode === 'normal') return normalMines ? normalMines.has(k) : false;
  return rand2(x, y) < density;
}

function countAround(x, y) {
  let n = 0;
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      if (isMine(x + dx, y + dy)) n++;
    }
  return n;
}

function getCell(x, y) {
  const k = key(x, y);
  let c = cells.get(k);
  if (!c) {
    c = { x: x, y: y, mine: isMine(x, y), open: false, flag: false, n: 0 };
    cells.set(k, c);
  }
  return c;
}

function ensureRoom(x, y) {
  if (mode !== 'endless') return;
  const pad = 2, grow = 4;
  if (x - world.minX < pad) world.minX = Math.max(-MAX_SIDE, world.minX - grow);
  if (world.maxX - x < pad) world.maxX = Math.min(MAX_SIDE, world.maxX + grow);
  if (y - world.minY < pad) world.minY = Math.max(-MAX_SIDE, world.minY - grow);
  if (world.maxY - y < pad) world.maxY = Math.min(MAX_SIDE, world.maxY + grow);
}

/* ---------- новая игра ---------- */
function updateHint() {
  if (mode === 'secret') {
    hintEl.textContent = 'Секретный уровень: 20×20 и 80 мин. Найди их все — или взорвись, как все.';
  } else if (mode === 'normal') {
    const p = NORMAL[densityKey];
    hintEl.textContent = 'Обычное поле ' + p.cols + '×' + p.rows + ' · ' + p.mines +
      ' мин · не расширяется · ЛКМ — открыть · ПКМ — флажок · ПКМ по цифре — её зона · на телефоне — долгое нажатие или режим флажка';
  } else {
    hintEl.textContent = 'Бесконечное поле: подходишь к краю — появляются новые клетки · ЛКМ — открыть · ПКМ — флажок · ПКМ по цифре — её зона · на телефоне — долгое нажатие или режим флажка';
  }
}

function syncModeSeg() {
  Array.prototype.forEach.call(modesEl.querySelectorAll('button'), function (b) {
    b.classList.toggle('on', b.dataset.mode === mode);
  });
  const labels = mode === 'normal' ? LEVEL_LABELS.normal : LEVEL_LABELS.endless;
  Array.prototype.forEach.call(levelsEl.querySelectorAll('button[data-density]'), function (b) {
    b.textContent = labels[b.dataset.density];
  });
}

function newGame() {
  stopTimer();
  timer = 0; timerEl.textContent = '0:00';
  started = false; dead = false; won = false;
  flags = 0; opened = 0;
  openedEl.textContent = '0';
  flagsEl.textContent = '0';
  overlay.classList.remove('show');

  seed = (Math.random() * 2147483647) | 0;
  cells = new Map();
  safeZone = new Set();
  secretMines = null;
  normalMines = null;

  if (mode === 'secret') {
    world = { minX: 0, minY: 0, maxX: SECRET.cols - 1, maxY: SECRET.rows - 1 };
    boardEl.classList.add('owner');
  } else if (mode === 'normal') {
    const p = NORMAL[densityKey];
    world = { minX: 0, minY: 0, maxX: p.cols - 1, maxY: p.rows - 1 };
    boardEl.classList.remove('owner');
  } else {
    world = { minX: 0, minY: 0, maxX: START.cols - 1, maxY: START.rows - 1 };
    boardEl.classList.remove('owner');
  }
  syncModeSeg();
  updateHint();
  if (mode === 'normal') mineCountEl.textContent = NORMAL[densityKey].mines;
  else if (mode === 'secret') mineCountEl.textContent = SECRET.mines;
  else mineCountEl.textContent = '∞';
  render();
}

function buildSafe(x, y) {
  safeZone = new Set();
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++) safeZone.add(key(x + dx, y + dy));
}

function buildSecretMines(x, y) {
  buildSafe(x, y);
  const total = SECRET.cols * SECRET.rows;
  secretMines = new Set();
  let guard = 0;
  while (secretMines.size < SECRET.mines && guard < total * 30) {
    guard++;
    const mx = Math.floor(Math.random() * SECRET.cols);
    const my = Math.floor(Math.random() * SECRET.rows);
    const k = key(mx, my);
    if (safeZone.has(k) || secretMines.has(k)) continue;
    secretMines.add(k);
  }
}

/* Обычный режим: ровно N мин, как в классике, а не "примерно 12%". */
function buildNormalMines(x, y) {
  buildSafe(x, y);
  const p = NORMAL[densityKey];
  const pool = [];
  for (let yy = 0; yy < p.rows; yy++) {
    for (let xx = 0; xx < p.cols; xx++) {
      if (safeZone.has(key(xx, yy))) continue;
      pool.push({ x: xx, y: yy, r: rand2(xx, yy) });
    }
  }
  pool.sort(function (a, b) { return a.r - b.r; });
  normalMines = new Set();
  for (let i = 0; i < Math.min(p.mines, pool.length); i++) {
    normalMines.add(key(pool[i].x, pool[i].y));
  }
}

/* ---------- отрисовка ---------- */
function cellSize(cols) {
  const gap = 4, padding = 24;
  const available = Math.min(window.innerWidth - 28, 720);
  const size = Math.floor((available - padding - (cols - 1) * gap) / cols);
  return Math.max(20, Math.min(34, size));
}

function render() {
  const cols = world.maxX - world.minX + 1;
  const rows = world.maxY - world.minY + 1;
  boardEl.style.setProperty('--cell', cellSize(cols) + 'px');
  boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', var(--cell))';
  const frag = document.createDocumentFragment();
  for (let y = world.minY; y <= world.maxY; y++) {
    for (let x = world.minX; x <= world.maxX; x++) {
      const c = getCell(x, y);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.dataset.x = x; b.dataset.y = y;
      if (c.open) {
        b.classList.add('open');
        if (c.mine) { b.classList.add('mine'); b.textContent = '💥'; }
        else if (!c.n) c.n = countAround(x, y);
        if (!c.mine && c.n > 0) { b.textContent = c.n; b.classList.add('n' + c.n); }
      } else if (c.flag) {
        b.classList.add('flag'); b.textContent = '🚩';
      }
      frag.appendChild(b);
    }
  }
  boardEl.innerHTML = '';
  boardEl.appendChild(frag);
}

/* ---------- открытие ---------- */
function openCell(x, y) {
  if (dead || won) return;
  if (x < world.minX || x > world.maxX || y < world.minY || y > world.maxY) return;
  const c = getCell(x, y);
  if (c.open || c.flag) return;

  sfxClick();

  if (!started) {
    started = true;
    if (mode === 'secret') buildSecretMines(x, y);
    else if (mode === 'normal') buildNormalMines(x, y);
    else buildSafe(x, y);
    // пересобираем кэш, чтобы безопасная зона и seed применились
    cells = new Map();
    flags = 0; flagsEl.textContent = '0';
    startTimer();
  }

  const cell = getCell(x, y);
  if (cell.mine) {
    cell.open = true;
    dead = true;
    stopTimer();
    sfxBoom();
    revealAll();
    if (mode === 'secret') {
      finish('Взрыв!', 'Секретный уровень не прощает ошибок. Открыто клеток: ' + opened + '.');
    } else {
      const score = Math.max(10, opened * 10);
      const label = mode === 'normal' ? 'Обычное поле' : 'Бесконечное поле';
      finish('Взрыв!', label + ' · открыто клеток: ' + opened + ' · время ' + fmtTime(timer) + ' · очки: ' + score);
      saveRecord(score);
    }
    return;
  }

  flood(x, y);
  render();
  updateOpened();
  checkWin();
}

function updateOpened() {
  openedEl.textContent = opened;
}

function flood(sx, sy) {
  const stack = [[sx, sy]];
  let guard = 0;
  let openedHere = 0;
  while (stack.length && guard < 60000 && openedHere < MAX_FLOOD) {
    guard++;
    const p = stack.pop();
    const x = p[0], y = p[1];
    if (x < world.minX || x > world.maxX || y < world.minY || y > world.maxY) continue;
    let c = getCell(x, y);
    if (c.open || c.flag || c.mine) continue;

    ensureRoom(x, y);
    c.open = true;
    opened++;
    openedHere++;
    if (!c.n) c.n = countAround(x, y);
    if (c.n === 0) {
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          stack.push([x + dx, y + dy]);
        }
    }
  }
}

function toggleFlag(x, y) {
  if (x < world.minX || x > world.maxX || y < world.minY || y > world.maxY) return;
  const c = getCell(x, y);
  if (c.open || dead || won) return;
  c.flag = !c.flag;
  flags += c.flag ? 1 : -1;
  flagsEl.textContent = flags;
  sfxFlag();
  render();
}

function checkWin() {
  if (won) return;

  if (mode === 'secret') {
    if (opened === SECRET.cols * SECRET.rows - SECRET.mines) {
      won = true;
      stopTimer();
      sfxWin();
      revealAll();
      finish('Победа!', 'Все 80 мин найдены за ' + fmtTime(timer) + '.');
      saveRecord(Math.max(10, 2000 - timer * 5), true);
    }
    return;
  }

  if (mode === 'normal') {
    const p = NORMAL[densityKey];
    const total = p.cols * p.rows;
    let mines = 0;
    for (let y = 0; y < p.rows; y++)
      for (let x = 0; x < p.cols; x++) if (isMine(x, y)) mines++;
    if (opened >= total - mines) {
      won = true;
      stopTimer();
      sfxWin();
      revealAll();
      const score = Math.max(10, opened * 10 + Math.max(0, 400 - timer * 3));
      finish('Победа!', 'Поле ' + p.cols + '×' + p.rows + ' зачищено за ' + fmtTime(timer) +
        ' · очки: ' + score);
      saveRecord(score, true);
    }
  }
}

function revealAll() {
  for (let y = world.minY; y <= world.maxY; y++)
    for (let x = world.minX; x <= world.maxX; x++) {
      const c = getCell(x, y);
      if (c.mine) c.open = true;
    }
  render();
}

function saveRecord(score, isWin) {
  const recordKey = mode === 'secret' ? 'mines_secret_best'
    : (mode === 'normal' ? 'mines_normal_best' : 'mines_endless_best');
  try {
    const best = Number(localStorage.getItem(recordKey) || 0);
    if (!best || score > best) localStorage.setItem(recordKey, String(score));
  } catch (e) {}
  if (!isWin && mode === 'secret') return;
  if (typeof lbSubmit === 'function') {
    try { lbSubmit('mines', lbName(), score); } catch (e) {}
  }
}

function finish(title, text) {
  ovTitle.textContent = title;
  ovText.textContent = text;
  overlay.classList.add('show');
}

/* ---------- события ---------- */
const flagModeBtn = document.getElementById('flagMode');
function syncFlagMode() {
  flagModeBtn.textContent = '🚩 Режим флажка: ' + (flagMode ? 'вкл' : 'выкл');
  flagModeBtn.classList.toggle('primary', flagMode);
}
syncFlagMode();
flagModeBtn.addEventListener('click', function () {
  flagMode = !flagMode;
  try { localStorage.setItem('mines_flag_mode', flagMode ? '1' : '0'); } catch (e) {}
  syncFlagMode();
});

let zoneTimer = null;
function clearZone() {
  Array.prototype.forEach.call(boardEl.querySelectorAll('.zone, .zone-src'), function (el) {
    el.classList.remove('zone', 'zone-src');
  });
}
/* ПКМ по цифре — подсветить клетки, которые она считает. */
function highlightZone(x, y) {
  clearZone();
  if (zoneTimer) clearTimeout(zoneTimer);
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const b = boardEl.querySelector('.cell[data-x="' + (x + dx) + '"][data-y="' + (y + dy) + '"]');
      if (b) b.classList.add('zone');
    }
  }
  const src = boardEl.querySelector('.cell[data-x="' + x + '"][data-y="' + y + '"]');
  if (src) src.classList.add('zone-src');
  zoneTimer = setTimeout(clearZone, 1600);
}

function cellIsNumber(b) {
  return b.classList.contains('open') && b.textContent && !b.classList.contains('mine');
}

boardEl.addEventListener('click', function (e) {
  const b = e.target.closest('.cell');
  if (!b) return;
  if (suppressClick) { suppressClick = false; return; }
  const x = +b.dataset.x, y = +b.dataset.y;
  if (flagMode && !b.classList.contains('open')) { toggleFlag(x, y); return; }
  openCell(x, y);
});

boardEl.addEventListener('contextmenu', function (e) {
  const b = e.target.closest('.cell');
  if (!b) return;
  e.preventDefault();
  const x = +b.dataset.x, y = +b.dataset.y;
  if (cellIsNumber(b)) highlightZone(x, y);
  else toggleFlag(x, y);
});

let pressTimer = null;
let suppressClick = false;
boardEl.addEventListener('touchstart', function (e) {
  const b = e.target.closest('.cell');
  if (!b) return;
  const x = +b.dataset.x, y = +b.dataset.y;
  pressTimer = setTimeout(function () {
    if (cellIsNumber(b)) highlightZone(x, y);
    else toggleFlag(x, y);
    suppressClick = true;
    pressTimer = null;
  }, 420);
}, { passive: true });
boardEl.addEventListener('touchend', function () {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
});
boardEl.addEventListener('touchmove', function () {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
});

levelsEl.addEventListener('click', function (e) {
  const b = e.target.closest('button[data-density]');
  if (!b) return;
  if (mode === 'secret') {
    mode = 'endless';
    document.title = 'Сапёр — Brickyard Arcade';
    boardEl.classList.remove('owner');
  }
  densityKey = b.dataset.density;
  density = DENSITIES[densityKey].value;
  Array.prototype.forEach.call(levelsEl.querySelectorAll('button'), function (x) {
    x.classList.toggle('on', x === b);
  });
  newGame();
});

modesEl.addEventListener('click', function (e) {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  if (b.dataset.mode === mode) return;
  mode = b.dataset.mode;
  document.title = 'Сапёр — Brickyard Arcade';
  boardEl.classList.remove('owner');
  newGame();
});

document.getElementById('restart').addEventListener('click', newGame);
document.getElementById('ovBtn').addEventListener('click', newGame);

window.addEventListener('resize', function () {
  if (!started && !dead) render();
});

/* ---------- старт / секретный уровень ---------- */
const params = new URLSearchParams(location.search);
if (params.has('secret')) {
  mode = 'secret';
  document.title = 'Секретный уровень — Сапёр';
  Array.prototype.forEach.call(levelsEl.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
  newGame();
  ovTitle.textContent = 'Секретный уровень 😈';
  ovText.textContent = 'Поле 20×20, 80 мин. Удачи, владелец.';
  overlay.classList.add('show');
  // profile.js подключается ниже — ждём, пока он инициализируется
  document.addEventListener('DOMContentLoaded', function () {
    if (window.arcadeProfile && typeof window.arcadeProfile.markSecret === 'function') {
      try { window.arcadeProfile.markSecret('mines80'); } catch (e) {}
    }
  });
} else {
  newGame();
}
</script>
