<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 — Brickyard Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d12">
<style>
  :root{
    --bg:#0a0d12; --panel:#121a23; --line:#1e2b38; --text:#e8f1f8;
    --muted:#7c8b9a; --neon:#39ff88; --gold:#f0c060;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1000px 600px at 50% -10%, #16324a 0%, transparent 60%),
               radial-gradient(800px 500px at 100% 100%, #3a2410 0%, transparent 55%), var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:min(560px,100%)}
  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .back{color:var(--muted); text-decoration:none; font-size:14px; border:1px solid var(--line); padding:8px 14px; border-radius:10px; transition:.2s}
  .back:hover{color:var(--text); border-color:rgba(57,255,136,.4)}
  h1{margin:0; font-size:34px; letter-spacing:1px}
  h1 span{color:var(--gold); text-shadow:0 0 18px rgba(240,192,96,.5)}
  .scores{display:flex; gap:10px}
  .score{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 16px; text-align:center; min-width:92px}
  .score small{display:block; color:var(--muted); font-size:10px; letter-spacing:1.5px; text-transform:uppercase}
  .score b{font-size:20px; color:var(--neon)}
  .score.best b{color:var(--gold)}
  .board{
    position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    padding:12px; border-radius:18px; background:linear-gradient(160deg,#0f1720,#0a1118);
    border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,.6);
    aspect-ratio:1/1; touch-action:none;
  }
  .cell{background:#141d26; border-radius:12px; display:grid; place-items:center; position:relative}
  .tile{
    position:absolute; inset:0; border-radius:12px; display:grid; place-items:center;
    font-weight:800; font-size:clamp(22px,7vw,40px); letter-spacing:-1px;
    animation:appear .16s ease;
  }
  .tile.merged{animation:pop .18s ease}
  @keyframes appear{from{transform:scale(.7); opacity:.4}to{transform:scale(1); opacity:1}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .v2{background:#26333f; color:#cfe0ee}
  .v4{background:#2f4a5f; color:#e2eef8}
  .v8{background:#2f6f5a; color:#dff8ee}
  .v16{background:#2a8f6a; color:#eafff6}
  .v32{background:#c9971b; color:#1c1405}
  .v64{background:#e07a24; color:#1c1005}
  .v128{background:#e05a4f; color:#fff2ef}
  .v256{background:#d9463f; color:#fff}
  .v512{background:#c0392b; color:#fff}
  .v1024{background:#a93226; color:#ffe9e5}
  .v2048{background:linear-gradient(145deg,#f7d774,#e0a92a); color:#2b1c05; box-shadow:0 0 26px rgba(240,192,96,.55)}
  .v4096{background:linear-gradient(145deg,#b06bff,#7a3fd4); color:#fff}
  .btns{display:flex; gap:10px; justify-content:space-between; margin-top:16px; flex-wrap:wrap}
  button.ui{
    padding:11px 20px; border-radius:10px; border:1px solid var(--line); cursor:pointer;
    background:var(--panel); color:var(--text); font-size:14px; font-weight:600;
  }
  button.ui:hover{border-color:rgba(57,255,136,.4)}
  button.primary{background:linear-gradient(180deg,#2dff8f,#12c96a); color:#052015; border:0; font-weight:800}
  .hint{color:var(--muted); font-size:13px; margin-top:12px; line-height:1.6}
  .overlay{
    position:fixed; inset:0; background:rgba(5,8,12,.72); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:10;
  }
  .overlay.show{display:flex}
  .modal{background:linear-gradient(160deg,#121b25,#0e151d); border:1px solid var(--line); border-radius:18px; padding:28px 34px; text-align:center; max-width:340px}
  .modal h2{margin:0 0 8px; font-size:30px}
  .modal p{margin:0 0 18px; color:var(--muted); font-size:14px}
  .modal .row{display:flex; gap:10px; justify-content:center}
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Brickyard Arcade">
<meta property="og:title" content="Brickyard Arcade — мини-игры">
<meta property="og:description" content="Шесть игр, колесо фортуны, турниры и мем-музей — всё в браузере.">
<meta property="og:url" content="https://att4cking-812.github.io/arcade/2048.html">
<meta property="og:image" content="https://att4cking-812.github.io/arcade/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← Аркада</a>
    <h1>20<span>48</span></h1>
    <div class="scores">
      <div class="score"><small>Счёт</small><b id="score">0</b></div>
      <div class="score best"><small>Рекорд</small><b id="best">0</b></div>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="btns">
    <div class="hint">Стрелки / WASD / свайпы</div>
    <button class="ui primary" id="newGame">Новая игра</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="ovTitle">Победа!</h2>
    <p id="ovText">Ты собрал 2048.</p>
    <div class="row">
      <button class="ui" id="ovContinue">Продолжить</button>
      <button class="ui primary" id="ovRestart">Заново</button>
    </div>
  </div>
</div>

<script>
const SIZE = 4;
let board, score, best, won, over, mergedCells;

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');

try { best = +(localStorage.getItem('g2048_best') || 0); } catch (e) { best = 0; }
bestEl.textContent = best;

// ---------- звук ----------
let actx = null;
function snd(freq, dur, type, vol, when) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.06));
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + (dur || 0.06) + 0.02);
  } catch (e) {}
}
const sfxMove  = () => snd(320, .04, 'sine', .04);
const sfxMerge = () => snd(720, .07, 'triangle', .07);
const sfxWinS  = () => { snd(660,.09,'triangle',.1); snd(880,.09,'triangle',.1,.09); snd(1320,.18,'triangle',.1,.18); };
const sfxLoseS = () => { snd(240,.15,'sawtooth',.1); snd(160,.25,'sawtooth',.1,.13); };

function newGame() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0; won = false; over = false; mergedCells = new Set();
  overlay.classList.remove('show');
  addRandom(); addRandom();
  update();
}

function emptyCells() {
  const list = [];
  for (let y = 0; y < SIZE; y++)
    for (let x = 0; x < SIZE; x++)
      if (!board[y][x]) list.push([x, y]);
  return list;
}

function addRandom() {
  const cells = emptyCells();
  if (!cells.length) return null;
  const [x, y] = cells[Math.floor(Math.random() * cells.length)];
  board[y][x] = Math.random() < 0.9 ? 2 : 4;
  return [x, y];
}

function update(newCell) {
  scoreEl.textContent = score;
  boardEl.innerHTML = '';
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const v = board[y][x];
      if (v) {
        const t = document.createElement('div');
        t.className = 'tile v' + v;
        if (mergedCells.has(x + ',' + y)) t.classList.add('merged');
        if (newCell && newCell[0] === x && newCell[1] === y) t.classList.add('merged');
        t.textContent = v;
        cell.appendChild(t);
      }
      boardEl.appendChild(cell);
    }
  }
}

function slideLine(line) {
  const vals = line.filter(v => v !== 0);
  const out = [];
  let gained = 0;
  for (let i = 0; i < vals.length; i++) {
    if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
      const v = vals[i] * 2;
      out.push(v);
      gained += v;
      if (v === 2048) won = true;
      i++;
    } else {
      out.push(vals[i]);
    }
  }
  while (out.length < SIZE) out.push(0);
  return { out, gained };
}

function move(dir) {
  if (over) return;
  const before = JSON.stringify(board);
  mergedCells = new Set();
  let gained = 0;

  for (let i = 0; i < SIZE; i++) {
    let line, coords;
    if (dir === 'left' || dir === 'right') {
      line = board[i].slice();
      coords = Array.from({ length: SIZE }, (_, j) => [j, i]);
      if (dir === 'right') { line.reverse(); coords.reverse(); }
    } else {
      line = Array.from({ length: SIZE }, (_, j) => board[j][i]);
      coords = Array.from({ length: SIZE }, (_, j) => [i, j]);
      if (dir === 'down') { line.reverse(); coords.reverse(); }
    }

    const { out, gained: g } = slideLine(line);
    gained += g;

    let k = 0;
    for (let j = 0; j < SIZE; j++) {
      const [x, y] = coords[j];
      board[y][x] = out[k];
      if (out[k] !== 0 && k > 0) mergedCells.add(x + ',' + y);
      k++;
    }
  }

  if (JSON.stringify(board) === before) return;

  sfxMove();
  if (gained > 0) sfxMerge();

  score += gained;
  if (score > best) {
    best = score;
    try { localStorage.setItem('g2048_best', best); } catch (e) {}
    bestEl.textContent = best;
  }

  const added = addRandom();
  update(added);

  if (won) {
    won = false;
    sfxWinS();
    ovTitle.textContent = 'Победа! 🎉';
    ovText.textContent = 'Ты собрал 2048. Можно продолжить.';
    overlay.classList.add('show');
    if (typeof lbSubmit === 'function') {
      try { lbSubmit('g2048', lbName(), score); } catch (e) {}
    }
    return;
  }
  checkOver();
}

function canMove() {
  if (emptyCells().length) return true;
  for (let y = 0; y < SIZE; y++)
    for (let x = 0; x < SIZE; x++) {
      const v = board[y][x];
      if (x + 1 < SIZE && board[y][x + 1] === v) return true;
      if (y + 1 < SIZE && board[y + 1][x] === v) return true;
    }
  return false;
}

function checkOver() {
  if (canMove()) return;
  over = true;
  sfxLoseS();
  ovTitle.textContent = 'Игра окончена';
  ovText.textContent = 'Ходов больше нет. Счёт: ' + score;
  overlay.classList.add('show');
  if (typeof lbSubmit === 'function') {
    try { lbSubmit('g2048', lbName(), score); } catch (e) {}
  }
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === 'arrowleft' || k === 'a') move('left');
  else if (k === 'arrowright' || k === 'd') move('right');
  else if (k === 'arrowup' || k === 'w') move('up');
  else if (k === 'arrowdown' || k === 's') move('down');
});

let sx = 0, sy = 0;
boardEl.addEventListener('touchstart', (e) => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, { passive: true });
boardEl.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
}, { passive: true });

document.getElementById('newGame').addEventListener('click', newGame);
document.getElementById('ovRestart').addEventListener('click', newGame);
document.getElementById('ovContinue').addEventListener('click', () => {
  overlay.classList.remove('show');
  if (over) newGame();
});

newGame();
</script>

</body>
