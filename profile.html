<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — Brickyard Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<meta name="description" content="Профиль игрока Brickyard Arcade: уровень, рекорды по играм и достижения.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹</text></svg>">
<style>
  :root{
    --bg:#0a0d12; --panel:#121a23; --line:#1e2b38; --text:#e8f1f8;
    --muted:#7c8b9a; --neon:#39ff88; --cyan:#00d4ff; --gold:#f0c060; --pink:#ff3b6b;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    min-height:100vh; color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(0,212,255,.16), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(57,255,136,.10), transparent 55%),
      radial-gradient(700px 600px at 50% 110%, rgba(240,192,96,.08), transparent 60%),
      var(--bg);
    padding:calc(34px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left));
  }
  .wrap{max-width:1000px; margin:0 auto}
  .top{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:30px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:12px}
  .logo{width:44px; height:44px; border-radius:13px; display:grid; place-items:center; font-size:22px;
    background:linear-gradient(145deg,#1b2b3a,#0f1720); border:1px solid var(--line); box-shadow:0 0 26px rgba(0,212,255,.18)}
  .brand h1{font-size:20px; letter-spacing:2px; font-weight:800}
  .brand small{display:block; color:var(--muted); font-size:11px; letter-spacing:2.5px; margin-top:2px}
  a.btn{text-decoration:none; color:var(--text); font-size:13px; padding:10px 16px; border-radius:10px;
    border:1px solid var(--line); background:rgba(255,255,255,.02); transition:.2s}
  a.btn:hover{border-color:rgba(57,255,136,.45); transform:translateY(-2px)}

  .profile-hero{display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    background:linear-gradient(160deg,rgba(25,36,48,.92),rgba(11,16,22,.96));
    border:1px solid var(--line); border-radius:22px; padding:24px 26px}
  .profile-avatar{width:88px; height:88px; border-radius:24px; display:grid; place-items:center;
    font-size:38px; font-weight:800; color:#08110c; background:linear-gradient(145deg,#39ff88,#00d4ff);
    box-shadow:0 0 40px rgba(57,255,136,.3)}
  .profile-id{flex:1; min-width:220px}
  .profile-name-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .profile-name-row h1{font-size:clamp(24px,4vw,34px); letter-spacing:-.6px}
  .profile-rename{background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:9px;    padding:6px 11px; font-size:12px; cursor:pointer; transition:.2s}
  .profile-rename:hover{color:var(--text); border-color:rgba(57,255,136,.45)}
  .profile-share{background:rgba(57,255,136,.10); color:var(--neon); border:1px solid rgba(57,255,136,.38);
    border-radius:9px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; transition:.2s}
  .profile-share:hover{background:rgba(57,255,136,.18); border-color:rgba(57,255,136,.6)}
  .profile-share:disabled{opacity:.6; cursor:wait}
  .profile-sub{color:var(--muted); font-size:14px; margin-top:6px}
  .profile-rename-box{display:flex; gap:8px; margin-top:12px}
  .profile-rename-box[hidden]{display:none}
  .profile-rename-box input{flex:1; min-width:140px; background:rgba(0,0,0,.25); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:10px 13px; font-size:14px; outline:none}
  .profile-rename-box input:focus{border-color:rgba(57,255,136,.55)}
  .profile-rename-box button{background:linear-gradient(145deg,#39ff88,#1fd76d); color:#06130b; border:0;
    border-radius:10px; padding:10px 16px; font-weight:800; font-size:13px; cursor:pointer}
  .profile-score{text-align:center; padding-left:14px; border-left:1px solid var(--line)}
  .profile-score b{display:block; font-size:34px; color:var(--neon); line-height:1}
  .profile-score span{font-size:12px; color:var(--muted)}

  .arcade-level{margin:22px 0 8px}
  .arcade-level-row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:7px}
  .arcade-level-name{font-weight:700}
  .arcade-level-num{color:var(--muted)}
  .arcade-level-bar{height:10px; border-radius:99px; background:rgba(255,255,255,.06); overflow:hidden}
  .arcade-level-bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#39ff88,#00d4ff); box-shadow:0 0 16px rgba(57,255,136,.4)}
  .arcade-level-next{font-size:12px; color:var(--muted); margin-top:6px}

  .profile-section{margin-top:34px}
  .profile-section h2{font-size:24px; letter-spacing:-.4px; margin-bottom:16px}
  .profile-bests{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
  .profile-best{display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:14px;
    background:linear-gradient(160deg,rgba(25,36,48,.9),rgba(11,16,22,.95)); border:1px solid var(--line)}
  .profile-best-icon{font-size:20px}
  .profile-best-name{flex:1; color:#cdd9e5; font-size:14px}
  .profile-best b{color:var(--neon); font-size:18px}

  .profile-badges{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px}
  .profile-badge{display:flex; gap:14px; align-items:flex-start; padding:16px 18px; border-radius:16px;
    background:linear-gradient(160deg,rgba(25,36,48,.7),rgba(11,16,22,.85)); border:1px solid var(--line); opacity:.55}
  .profile-badge.open{opacity:1; border-color:rgba(57,255,136,.35); box-shadow:0 0 26px rgba(57,255,136,.06)}
  .profile-badge-icon{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:21px;
    background:rgba(255,255,255,.04); border:1px solid var(--line); flex:0 0 auto}
  .profile-badge.open .profile-badge-icon{background:rgba(57,255,136,.1); border-color:rgba(57,255,136,.4)}
  .profile-badge-title{font-size:15px; font-weight:700; margin-bottom:4px}
  .profile-badge-desc{font-size:12px; color:var(--muted); line-height:1.5}

  .profile-avatar img{width:100%; height:100%; object-fit:cover; border-radius:inherit}

  .profile-discord-tag{font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#39ff88;
    border:1px solid rgba(57,255,136,.35); background:rgba(57,255,136,.08); border-radius:99px; padding:3px 9px;
    align-self:center; white-space:nowrap}

  .auth-bar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:linear-gradient(160deg,rgba(25,36,48,.82),rgba(11,16,22,.92)); border:1px solid var(--line);
    border-radius:16px; padding:14px 18px; margin-bottom:18px}
  .auth-copy{display:flex; flex-direction:column; gap:3px}
  .auth-copy b{font-size:14px}
  .auth-copy span{font-size:12px; color:var(--muted)}
  .auth-btn{text-decoration:none; color:#06130b; background:linear-gradient(145deg,#39ff88,#1fd76d); border:0;
    border-radius:10px; padding:10px 16px; font-weight:800; font-size:13px; cursor:pointer; white-space:nowrap}
  .auth-btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:600}
  .auth-btn.ghost:hover{color:var(--text); border-color:rgba(57,255,136,.4)}
  .auth-user{display:flex; align-items:center; gap:12px}
  .auth-avatar{width:38px; height:38px; border-radius:12px; object-fit:cover; border:1px solid var(--line)}
  .auth-avatar.fallback{display:grid; place-items:center; background:linear-gradient(145deg,#39ff88,#00d4ff); color:#08110c; font-weight:800}

  footer{margin-top:44px; padding-top:20px; border-top:1px solid var(--line); display:flex;
    justify-content:space-between; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:13px}
  footer a{color:var(--muted); text-decoration:none}
  footer a:hover{color:var(--text)}

  @media (max-width:640px){
    body{padding:24px 16px 44px}
    .profile-hero{padding:20px}
    .profile-avatar{width:68px; height:68px; border-radius:18px; font-size:28px}
    .profile-score{border-left:0; padding-left:0; text-align:left}
    .profile-bests,.profile-badges{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">🕹</div>
      <div>
        <h1>BRICKYARD ARCADE</h1>
        <small>ПРОФИЛЬ ИГРОКА</small>
      </div>
    </div>
    <div class="links">
      <a class="btn" href="index.html">← В аркаду</a>
    </div>
  </div>

  <div id="profileRoot">
    <div class="profile-hero"><div class="profile-avatar">?</div><div class="profile-id"><h1>Загрузка…</h1></div></div>
  </div>

  <footer>
    <div>© Brickyard Arcade · сделано с 🍷</div>
    <div><a href="index.html">аркада</a> · <a href="https://att4cking-812.github.io/brickyard/">brickyard</a> · <a href="https://discord.gg/nWAATWnnnJ">discord</a></div>
  </footer>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
<script src="leaderboard.js?v=15"></script>
<script src="profile.js?v=7"></script>
</body>
</html>
